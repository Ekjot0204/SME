<!DOCTYPE html>
<html>
<head>
    <title>Focus Event</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<input type="text" id="name" placeholder="Enter your name">

<script>
$(document).ready(function() {
    $("#name").focus(function() {
        $(this).css("background-color", "lightyellow");
    });
});
</script>

</body>
</html>fo
