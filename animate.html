<!DOCTYPE html>
<html>
<head>
    <title>jQuery Animate</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        #box {
            width: 100px;
            height: 100px;
            background-color: seagreen;
            position: relative;
        }
    </style>
</head>
<body>

    <h2>jQuery Animate Effect</h2>

    <div id="box"></div>
    <br>

    <button id="animate">Animate</button>

    <script>
        $(document).ready(function() {

            $("#animate").click(function() {

                $("#box").animate({
                    left: '200px',
                    width: '200px',
                    height: '200px'
                }, 2000);

            });

        });
    </script>

</body>
</html>a
