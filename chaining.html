<!DOCTYPE html>
<html>
<head>
    <title>jQuery Chaining</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <h2 id="text">Hello Students!</h2>

    <button id="btn">Click Me</button>

    <script>
        $(document).ready(function() {

            $("#btn").click(function() {

                $("#text")
                    .css("color", "red")
                    .slideUp(1000)
                    .slideDown(1000);

            });

        });
    </script>

</body>
</html>c
